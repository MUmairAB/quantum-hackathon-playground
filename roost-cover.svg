      <rect x="2" y="2" width="43" height="43" rx="9" fill="#f8fcf8" stroke="#bdd8c8" stroke-width="2"/>
    </pattern>
    <linearGradient id="cave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf7ef"/>
      <stop offset="1" stop-color="#fff4dc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#cave)"/>
