<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Roost: Read the cave, choose your light</title>
  <desc id="desc">A pale mint cave scene with a six-by-six clue grid, sleeping bats, and a warm two-path photon probe.</desc>
  <defs>
